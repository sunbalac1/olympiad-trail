name = "olympiad-trail-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Secrets (DATABASE_URL, JWT_SECRET) are NOT set here.
# For local dev: create server/.dev.vars (gitignored) with:
#   DATABASE_URL=postgresql://...neon connection string...
#   JWT_SECRET=some-long-random-string
# For production: `wrangler secret put DATABASE_URL` and
#   `wrangler secret put JWT_SECRET` (see server/README.md).

[vars]
# Comma-separated list of allowed frontend origins for CORS. Must be
# first-party (same registrable domain as the API) for the session
# cookie to survive browser cross-site cookie blocking — see git log
# for the api.nalnaal.com migration if this needs to change again.
FRONTEND_ORIGIN = "https://nalnaal.com,https://www.nalnaal.com"

[[routes]]
pattern = "api.nalnaal.com"
custom_domain = true

[observability]
enabled = true
